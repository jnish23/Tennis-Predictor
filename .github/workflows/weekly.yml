name: weekly

# Everything the daily run does, plus the walk-forward backtest and a refit of
# the production models (about half an hour of compute locally).

on:
  schedule:
    - cron: "30 7 * * 1"
  workflow_dispatch:

concurrency:
  group: data-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Make sure the data release exists
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest \
            --title "Pipeline data" --prerelease \
            --notes "Rolling assets replaced by the scheduled workflows. Not a software release."

      - name: Restore state
        run: |
          mkdir -p .restore data
          gh release download data-latest -p state.tar.zst -p odds_snapshots.parquet --dir .restore --clobber || true
          if [ -f .restore/state.tar.zst ]; then python -m tennis.ops.bundle unpack-state .restore/state.tar.zst; fi
          if [ -f .restore/odds_snapshots.parquet ]; then cp .restore/odds_snapshots.parquet data/; fi

      - name: Run pipeline (with backtest and retrain)
        run: python -m tennis.ops.cloud weekly --out dist

      - name: Publish
        run: gh release upload data-latest dist/serve.tar.zst dist/state.tar.zst --clobber

      # Scheduled workflows are switched off after 60 days without repository
      # activity, and the pipeline only touches release assets. A monthly empty
      # commit keeps them alive.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date +%d)" -le 7 ]; then
            git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflows active" && git push
          fi
